<style>
/* Home: the Constellation. Every goalie researcher is a light in their main topic's colour on a slowly turning globe,
   linked to their co-authors (constellation.js), under the journal's name; drag the globe to spin it; framed topic chips below it are the colour key; four doors lead into the site.
   No footer here, to keep the page as clean as possible (Goldy, 2026-10-31).
   The topic colours below are shared with the legend and the dots. */
:root {
  --h1-hover: #9a7420;   /* masthead title hover and the footer tip pill */
  --glass: rgba(255, 255, 255, 0.55); --glass-line: rgba(133, 97, 15, 0.26);
  --t-hip: #4450b0; --t-inj: #d43d63; --t-eq: #c77a00; --t-vis: #0f8f89; --t-phy: #2e9a3f;
  --t-bio: #7a4fd6; --t-psy: #c2398a; --t-dev: #1f7fcf; --t-stats: #9a8a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --h1-hover: #efd28a;
    --glass: rgba(20, 25, 37, 0.45); --glass-line: rgba(226, 185, 85, 0.24);
    --t-hip: #8c9aff; --t-inj: #ff6b8b; --t-eq: #ffb547; --t-vis: #3fd8cf; --t-phy: #6ee07a;
    --t-bio: #b896ff; --t-psy: #ff8fd1; --t-dev: #5ab8ff; --t-stats: #f2e05a;
  }
}
:root[data-theme="dark"] {
  --h1-hover: #efd28a;
  --glass: rgba(20, 25, 37, 0.45); --glass-line: rgba(226, 185, 85, 0.24);
  --t-hip: #8c9aff; --t-inj: #ff6b8b; --t-eq: #ffb547; --t-vis: #3fd8cf; --t-phy: #6ee07a;
  --t-bio: #b896ff; --t-psy: #ff8fd1; --t-dev: #5ab8ff; --t-stats: #f2e05a;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 var(--serif); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }

.sky { position: relative; isolation: isolate; overflow: hidden; min-height: calc(100svh - 56px); display: grid; place-items: center; padding: 48px 16px 96px; text-align: center; }
.sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; cursor: grab; touch-action: pan-y; }
.sky.grabbing canvas { cursor: grabbing; }
.sky::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 42% 30% at 50% 47%, color-mix(in srgb, var(--bg) 72%, transparent), transparent); }
.sky h1 { margin: 0 0 28px; font: 600 clamp(30px, 5.4vw, 70px)/1.04 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.sky h1 > span { display: block; }
.spectrum { background: linear-gradient(95deg, var(--t-hip), var(--t-bio), var(--t-psy), var(--t-inj), var(--t-eq), var(--t-stats), var(--t-phy), var(--t-vis), var(--t-dev), var(--t-hip));
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: spectrum 16s linear infinite; }
@keyframes spectrum { to { background-position: 300% 0; } }
.go { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 999px; font: 600 15px var(--sans); color: var(--fg); text-decoration: none;
  background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6);
  transition: transform 0.25s ease, box-shadow 0.25s ease; }
.go:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--accent), 0 12px 30px -12px var(--accent); }
/* Topic key: one framed chip per topic, tinted in its colour */
.legend { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(100% - 32px, 980px); margin: 0; padding: 0; list-style: none;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font: 500 11px/1 var(--label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg); }
.legend li { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; cursor: default;
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 13%, var(--bg));
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: opacity 0.2s ease, background-color 0.2s ease; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend.dim li { opacity: 0.35; } .legend li.hot { opacity: 1; background: color-mix(in srgb, var(--c) 30%, var(--bg)); }
.tip { position: absolute; z-index: 2; pointer-events: none; font: 500 12px var(--sans); background: var(--surface); color: var(--fg); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; white-space: nowrap; opacity: 0; transition: opacity 0.2s ease; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.doors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding-block: 40px 64px; }
.door { position: relative; display: block; padding: 20px 20px 18px 24px; border: 1px solid var(--rule); border-radius: 12px; color: var(--fg); text-decoration: none; overflow: hidden;
  transition: transform 0.35s cubic-bezier(.2, .8, .2, 1), border-color 0.35s ease; }
.door::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.door:hover, .door:focus-visible { transform: translateY(-3px); border-color: var(--c); }
.door b { display: block; font: 600 19px/1.2 var(--display); }
.door small { display: block; margin-top: 6px; font: 500 11px var(--label); letter-spacing: 0.14em; text-transform: uppercase; color: var(--c); }
@media (max-width: 880px) { .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sky { min-height: 78svh; } }
@media (max-width: 620px) { .sky { padding-bottom: 28px; grid-template-rows: 1fr auto; } .legend { position: static; transform: none; width: auto; margin-top: 8px; gap: 6px; font-size: 10px; } .legend li { padding: 6px 10px; } }
@media (prefers-reduced-motion: reduce) { .spectrum { animation: none; } .door, .go { transition: none; } }
</style>
</head>
