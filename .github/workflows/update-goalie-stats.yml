# Stats bot: refreshes the Goalie Stats page (goalies-data.js) from the NHL stats feed once a day,
# saves this season's Natural Stat Trick goalie tables in data/nst/, then rebuilds goalies-uncertainty-data.js
# so the "How sure are we" panels match (its expected goals come from NST), and rebuilds goal-map-data.js
# (every shot on goal, with its location) from the NHL play-by-play feed for the goals heat map,
# starters-data.js (projected starting goalies for the next game day) from the NHL schedule,
# and goalie-types-data.js (each goalie's playing type for the illustrations), so the types are refined after every night's games.
# Needs a repository secret named NST_KEY (the Natural Stat Trick access key) for that last part;
# without it the NHL numbers still update.
# Needs Settings > Actions > General > Workflow permissions set to "Read and write permissions".
name: Update goalie stats

on:
  schedule:
    - cron: "0 9 * * *"   # every day at 09:00 UTC (early morning in North America, after the night's games)
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-goalie-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull this season's goalie totals
        run: python3 build_goalies_data.py

      - name: Pull Natural Stat Trick goalie stats
        continue-on-error: true
        env:
          NST_KEY: ${{ secrets.NST_KEY }}
        run: python3 fetch_nst.py

      - name: Rebuild the save % ranges
        run: python3 build_uncertainty_data.py

      - name: Rebuild the goals heat map
        continue-on-error: true
        run: python3 build_goal_map.py

      - name: Sort goalies into playing types
        continue-on-error: true
        run: python3 build_goalie_types.py

      - name: Project tonight's starting goalies
        continue-on-error: true
        run: python3 build_starters.py

      - name: Commit if anything changed
        run: |
          git config user.name "goalie-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in goalies-data.js goalies-uncertainty-data.js data/nst goal-map-data.js data/goal-map starters-data.js goalie-types-data.js; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No new stats."
            exit 0
          fi
          git commit -m "Update goalie stats for $(TZ=America/New_York date +%F)"
          git push
