# Optional: refreshes research.js (and videos.js if a YouTube key is set) every day.
# One-time setup on GitHub: Settings > Actions > General > Workflow permissions > "Read and write permissions".
# For videos only: Settings > Secrets and variables > Actions > New repository secret named YOUTUBE_API_KEY.
# Run it any time from the Actions tab (Run workflow).
name: Update research and videos
on:
  schedule:
    - cron: "47 11 * * *"   # daily, 11:47 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch research
        run: python3 fetch_research.py --write
      - name: Fetch videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fetch_videos.py --write
      - name: Commit changes
        run: |
          git config user.name "feeds-bot"
          git config user.email "feeds-bot@users.noreply.github.com"
          git add research.js videos.js
          git diff --cached --quiet || git commit -m "Update research and videos"
          git pull --rebase
          git push
